# ============================================================================
# CONFIGURACIÓN GENERAL DEL SERVIDOR
# ============================================================================
server.port=8080
server.servlet.context-path=/api/v1

# ============================================================================
# CONFIGURACIÓN DE LA BASE DE DATOS (POSTGRESQL)
# Conexión al contenedor Docker configurado en docker-compose.yml
# ============================================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/proyectogeo_db
spring.datasource.username=geo_admin
spring.datasource.password=geo_password_2026
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================================
# INICIALIZACIÓN DE LA BASE DE DATOS MEDIANTE SCRIPT
# Permite que Spring Boot ejecute schema.sql al arrancar
# ============================================================================
# Ejecuta scripts DDL (schema.sql) y DML (data.sql si existiera) en cada arranque
# Cambiado a 'never' para prevenir la pérdida de las ediciones de datos que el usuario realiza desde la consola.
spring.sql.init.mode=never
# Evita fallos si intentamos volver a crear elementos ya existentes (aunque schema.sql ya limpia las tablas)
spring.sql.init.continue-on-error=false

# ============================================================================
# CONFIGURACIÓN DE JPA / HIBERNATE
# ============================================================================
# ddl-auto: Cambiado a 'update' para que Hibernate sincronice y agregue nuevas columnas sin destruir datos.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Mostrar y formatear consultas SQL en consola para desarrollo y depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# ============================================================================
# CONFIGURACIÓN DE LOGS (FORMATO Y NIVELES)
# ============================================================================
# Nivel de logging general y específico para SQL
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Formato personalizado de logs para máxima legibilidad
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n

# ============================================================================
# CONFIGURACIÓN DE SWAGGER / OPENAPI (SPRINGDOC)
# ============================================================================
# Redirige de /api/v1/swagger-ui.html directamente a la consola gráfica de OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
# Habilita la ordenación de las APIs por método HTTP (GET, POST, etc.)
springdoc.swagger-ui.operationsSorter=method

# ============================================================================
# CONFIGURACIÓN DE SEGURIDAD (BASIC AUTH EN DESARROLLO)
# ============================================================================
spring.security.user.name=admin
spring.security.user.password=tektonica_admin_2026
spring.security.user.roles=ADMIN

