<div class="login-container">

  <!-- Tarjeta Central de Autenticación -->
  <div class="login-card">

    <!-- Isotipo Vectorial Oficial de TEKTONICA -->
    <div class="login-brand">
      <svg class="login-logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
        <!-- Prisma / Diamante Tridimensional Facetado -->
        <polygon points="50,5 90,70 50,95 10,70" stroke="currentColor" stroke-width="4.5" stroke-linejoin="round"/>
        <line x1="50" y1="5" x2="50" y2="95" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <line x1="10" y1="70" x2="50" y2="72" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <line x1="90" y1="70" x2="50" y2="72" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <line x1="10" y1="70" x2="50" y2="48" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <line x1="90" y1="70" x2="50" y2="48" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
        <!-- Planeta Central -->
        <circle cx="50" cy="48" r="18" fill="#FFFFFF" stroke="currentColor" stroke-width="4.5"/>
        <!-- Órbita Satelital -->
        <path d="M 23,60 C 23,60 38,40 68,28" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" fill="none" />
        <!-- Satélite con Paneles Solares -->
        <g transform="translate(68, 28) rotate(-35)">
          <rect x="-3" y="-3" width="6" height="6" fill="currentColor" rx="1"/>
          <path d="M 0,3 L 0,6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="0" cy="6" r="1.5" fill="currentColor"/>
          <line x1="-3" y1="0" x2="-10" y2="0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <line x1="3" y1="0" x2="10" y2="0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
          <line x1="-10" y1="-3" x2="-10" y2="3" stroke="currentColor" stroke-width="1.5"/>
          <line x1="10" y1="-3" x2="10" y2="3" stroke="currentColor" stroke-width="1.5"/>
        </g>
      </svg>
      <span class="login-brand-text">TEKTONICA</span>
    </div>

    <!-- Encabezado de Acceso -->
    <div class="login-header">
      <h1 class="login-title">Panel Administrativo</h1>
      <p class="login-subtitle">Ingrese sus credenciales de operador para acceder a la consola de gestión del catálogo técnico.</p>
    </div>

    <!-- Mensaje de Error de Credenciales -->
    <div *ngIf="errorCredenciales" class="login-error-banner">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
      <span>Credenciales inválidas. Verifique su correo electrónico y contraseña de operador.</span>
    </div>

    <!-- Formulario de Autenticación -->
    <form class="login-form" (ngSubmit)="onSubmit()">

      <!-- Campo: Correo Electrónico -->
      <div class="form-group">
        <label for="login-email" class="form-label">Correo Electrónico</label>
        <input
          id="login-email"
          type="email"
          class="form-input"
          placeholder="operador@tektonica.com"
          [(ngModel)]="email"
          name="email"
          required
          autocomplete="email"
        />
      </div>

      <!-- Campo: Contraseña -->
      <div class="form-group">
        <label for="login-password" class="form-label">Contraseña</label>
        <input
          id="login-password"
          type="password"
          class="form-input"
          placeholder="••••••••"
          [(ngModel)]="contrasena"
          name="contrasena"
          required
          autocomplete="current-password"
        />
      </div>

      <!-- Botón Principal de Acceso -->
      <button
        type="submit"
        class="login-submit-btn"
        [disabled]="cargando || !email || !contrasena"
      >
        <span *ngIf="!cargando">Iniciar Sesión</span>
        <span *ngIf="cargando" class="login-spinner">Verificando...</span>
      </button>

    </form>

    <!-- Nota de Seguridad Inferior -->
    <p class="login-footer-note">
      Acceso exclusivo para operadores técnicos autorizados de TEKTONICA S.A.
    </p>

  </div>

</div>
